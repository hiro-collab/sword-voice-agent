[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sword-voice-agent"
version = "0.1.0"
description = "Control-plane and launcher tools for the local Sword Agent OS system cell."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "hiro-collab" }
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
sword-gate-sim = "sword_voice_agent.apps.gate_simulator:main"
sword-gesture-http = "sword_voice_agent.apps.gesture_http_server:main"
sword-gesture-udp = "sword_voice_agent.apps.gesture_udp_receiver:main"
sword-demo-gestures = "sword_voice_agent.apps.send_demo_gestures:main"
sword-thought-core-handoff = "sword_voice_agent.apps.send_handoff_to_thought_core:main"
sword-thought-core-watch = "sword_voice_agent.apps.watch_handoff_to_thought_core:main"
sword-no-provider-child-provenance = "sword_voice_agent.apps.build_no_provider_child_provenance_diagnostics:main"
sword-console = "sword_voice_agent.apps.console_server:main"
sword-status-clear = "sword_voice_agent.apps.clear_status:main"
sword-ai-talk-core-web = "sword_voice_agent.apps.ai_talk_core_web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sword_voice_agent = ["web/*.html", "web/*.css", "web/*.js"]

[tool.uv]
cache-dir = ".uv-cache"
