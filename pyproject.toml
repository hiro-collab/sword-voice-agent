[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sword-voice-agent"
version = "0.1.0"
description = "Gesture-gated voice interface for AI agents such as Dify."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "hiro-collab" }
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
sword-gate-sim = "sword_voice_agent.apps.gate_simulator:main"
sword-gesture-http = "sword_voice_agent.apps.gesture_http_server:main"
sword-gesture-udp = "sword_voice_agent.apps.gesture_udp_receiver:main"
sword-demo-gestures = "sword_voice_agent.apps.send_demo_gestures:main"
sword-dify-handoff = "sword_voice_agent.apps.send_handoff_to_dify:main"

[tool.setuptools.packages.find]
where = ["src"]
