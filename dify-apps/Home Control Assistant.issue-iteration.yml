      - data:
          selected: false
          title: 家電返答・判定LLM 2
          type: llm
          context:
            enabled: false
            variable_selector: []
          memory:
            query_prompt_template: |-
              {{#sys.query#}}

              {{#sys.files#}}
            role_prefix:
              assistant: ''
