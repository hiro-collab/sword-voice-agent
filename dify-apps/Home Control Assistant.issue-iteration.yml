      - data:
          selected: false
          title: 判定JSON整形 1
          type: code
          code: |
            import json
            import re
            from datetime import datetime, timezone

            MAX_ATTEMPTS = 3
            ALLOWED_DECISIONS = {"finish", "retry_ai", "ask_user"}
            ALLOWED_STATUSES = {"resolved", "retrying", "need_user", "failed", "closed"}
            POST_ACTION_ROOM_LIGHT_ACTIONS = {"light_on": "on", "light_off": "off"}


            def _loads(raw: str) -> dict:
                try:
                    parsed = json.loads(raw or "{}")
                except Exception:
                    match = re.search(r"\{.*\}", raw or "", re.S)
                    if not match:
                        return {}
                    try:
                        parsed = json.loads(match.group(0))
                    except Exception:
                        return {}
                return parsed if isinstance(parsed, dict) else {}


            def _as_int(value, default=1) -> int:
                try:
                    return int(float(value))
                except Exception:
                    return default


            def _as_bool(value) -> bool:
                if isinstance(value, bool):
                    return value
                if isinstance(value, str):
                    return value.strip().lower() in {"true", "1", "yes", "y"}
                return False


            def _environment_from_body(raw: str) -> dict:
                data = _loads(raw or "")
                if isinstance(data.get("environment"), dict):
                    return data["environment"]
                if isinstance(data.get("body"), dict):
                    return data["body"]
                return data if isinstance(data, dict) else {}


            def _room_light_query(environment: dict) -> dict:
                queries = environment.get("state_queries") if isinstance(environment, dict) else {}
                if not isinstance(queries, dict):
                    return {}
                room_light = queries.get("room_light")
                return room_light if isinstance(room_light, dict) else {}


            def _wait_result(environment: dict) -> dict:
                wait = environment.get("wait_result") if isinstance(environment, dict) else {}
                return wait if isinstance(wait, dict) else {}


            def _post_action_wait_matched(environment: dict) -> bool:
                wait = _wait_result(environment)
                return _as_bool(wait.get("matched")) if wait else False


            def _post_action_wait_timed_out(action_id: str, result_status: str, decision: str, environment: dict) -> bool:
                if not POST_ACTION_ROOM_LIGHT_ACTIONS.get(action_id) or result_status != "success" or decision != "finish":
                    return False
                wait = _wait_result(environment)
                return bool(wait) and not _as_bool(wait.get("matched"))


            def _post_action_feedback_needed(action_id: str, result_status: str, decision: str, room_light: dict, environment: dict) -> bool:
                expected = POST_ACTION_ROOM_LIGHT_ACTIONS.get(action_id)
                if not expected or result_status != "success" or decision != "finish":
                    return False
                if not _post_action_wait_matched(environment):
                    return False
                if not room_light or room_light.get("available") is False or _as_bool(room_light.get("stale")):
                    return False
                state = str(room_light.get("state") or "unknown").lower()
                confidence = str(room_light.get("confidence_label") or "").lower()
                return state in {"", "unknown"} or confidence in {"", "low"} or (state in {"on", "off"} and state != expected)


            def _append_post_action_feedback_prompt(user_reply: str, action_id: str, room_light: dict) -> str:
                expected = POST_ACTION_ROOM_LIGHT_ACTIONS.get(action_id, "unknown")
                expected_text = "ついてる" if expected == "on" else "消えてる"
                state = str(room_light.get("state") or "unknown").lower()
                confidence = str(room_light.get("confidence_label") or "").lower()
                if state in {"on", "off"} and state != expected:
                    prompt = f"映像だと少しズレて見えるんだが、実際は{expected_text}か？"
                elif confidence in {"", "low"}:
                    prompt = f"映像だとまだ自信が低いんだが、実際は{expected_text}か？"
                else:
                    prompt = f"実際は{expected_text}か？"
                visible = _visible_reply(user_reply)
                if "実際" in visible or "ついてるか" in visible or "消えてるか" in visible:
                    return user_reply
                return f"{user_reply.rstrip()} {prompt}"


            def _append_post_action_wait_note(user_reply: str, environment: dict) -> str:
                visible = _visible_reply(user_reply)
                if "映像側の更新" in visible:
                    return user_reply
                return f"{user_reply.rstrip()} 映像側の更新がまだ取れてねえな。状態確認は少し待ってからにするぜ。"


            def _build_post_action_pending(action_id: str, issue_id: str, room_light: dict, environment: dict) -> tuple[str, str]:
                expected = POST_ACTION_ROOM_LIGHT_ACTIONS.get(action_id)
                if not expected:
                    return "", ""
                evidence = room_light.get("evidence") if isinstance(room_light.get("evidence"), dict) else {}
                wait = _wait_result(environment)
                pending = {
                    "type": "state_query_pending",
                    "state_query_id": "room_light",
                    "target": "room_light",
                    "feedback_reason": "user_correction_after_light_action",
                    "source_context": "post_light_action",
                    "action_id": action_id,
                    "issue_id": issue_id,
                    "expected_state": expected,
                    "snapshot_id": str(environment.get("snapshot_id") or ""),
                    "authority": str(room_light.get("authority") or room_light.get("source") or ""),
                    "projected_by": str(room_light.get("projected_by") or ""),
                    "predicted_state": str(room_light.get("state") or "unknown"),
                    "confidence_label": str(room_light.get("confidence_label") or ""),
                    "answer_hint": str(room_light.get("answer_hint") or ""),
                    "workflow_version": "post-action-room-light-feedback-v1",
                    "created_at": datetime.now(timezone.utc).isoformat(),
                    "observed_at": str(room_light.get("observed_at") or evidence.get("observed_at") or ""),
                    "updated_at": str(room_light.get("updated_at") or evidence.get("updated_at") or ""),
                    "wait_result": {
                        "target": wait.get("target") or "",
                        "matched": _as_bool(wait.get("matched")),
                        "after": wait.get("after") or "",
                        "observed_at": wait.get("observed_at") or "",
                        "elapsed_ms": wait.get("elapsed_ms"),
                        "reason": wait.get("reason") or "",
                    },
                    "evidence": {
                        "source": evidence.get("source") or "",
                        "topic": evidence.get("topic") or "",
                        "lighting_type": evidence.get("lighting_type") or "",
                        "daylight_state": evidence.get("daylight_state") or "",
                        "electric_on_probability": evidence.get("electric_on_probability"),
                        "daylight_present_probability": evidence.get("daylight_present_probability"),
                        "dark_probability": evidence.get("dark_probability"),
                    },
                }
                return "room_light", json.dumps(pending, ensure_ascii=False, sort_keys=True)


            def _is_config_or_bridge_error(result: dict, bridge_status: str) -> bool:
                raw = result.get("raw") if isinstance(result.get("raw"), dict) else {}
                fields = [
                    bridge_status,
                    result.get("detail"),
                    result.get("raw_body"),
                    raw.get("status"),
                    raw.get("detail"),
                    raw.get("error"),
                    raw.get("message"),
                ]
                text = " ".join(str(value) for value in fields if value is not None).lower()
                return (
                    bridge_status == "http_node_error"
                    or "home_control_api_token" in text
                    or "unauthorized" in text
                    or "401" in text
                )


            def _sounds_like_retry(text: str) -> bool:
                normalized = (text or "").lower()
                markers = [
                    "retry",
                    "再試行",
                    "もう一回",
                    "もう1回",
                    "もう一度",
                    "再度",
                    "試してみる",
                    "試す",
                    "やり直",
                    "同じ操作",
                ]
                return any(marker in normalized for marker in markers)


            def _visible_reply(text: str) -> str:
                without_tags = re.sub(r"\[[^\]]+\]", "", text or "")
                return re.sub(r"\s+", "", without_tags).strip()


            KNOWN_MOTION_TAGS = {
                "think",
                "cheer",
                "cross",
                "mouth_cover",
                "crossed_arms",
                "bow",
                "shrug",
                "shy",
                "wave",
                "clap",
            }


            def _normalize_motion_tags(text: str) -> str:
                def normalize(match):
                    name = str(match.group(1) or "").lower()
                    if name in KNOWN_MOTION_TAGS:
                        return f"[motion:{name}]"
                    return match.group(0)

                normalized = re.sub(r"\[motion:([A-Za-z_][A-Za-z0-9_-]*)\]", normalize, text or "", flags=re.I)
                return re.sub(r"\[([A-Za-z_][A-Za-z0-9_-]*)\]", normalize, normalized)


            def _needs_guarded_reply(user_reply: str, result_status: str) -> bool:
                visible = _visible_reply(user_reply)
                normalized = visible.lower()
                if not visible:
                    return True
                compact_visible = re.sub(r"\s+", "", visible).rstrip("。.!！?？")
                weak_echo_markers = [
                    "してほしい",
                    "ほしいんだな",
                    "件か",
                    "操作だな",
                ]
                weak_ack_markers = [
                    "見るぞ",
                    "はいよ",
                    "ふんふん",
                    "ほうほう",
                    "ちょい待",
                    "まかせな",
                    "了解。",
                    "はい、お願い",
                    "おっけい、お願い",
                    "実行してくれ",
                    "やってくれ",
                    "頼むぜ",
                ]
                if any(marker in visible for marker in weak_echo_markers):
                    return True
                if compact_visible in {marker.rstrip("。.!！?？") for marker in weak_ack_markers}:
                    return True
                if result_status == "confirmation_required":
                    confirmation_markers = [
                        "まだ",
                        "確認",
                        "承認",
                        "許可",
                        "実行するなら",
                        "やるなら",
                        "進めるなら",
                        "言って",
                        "教えて",
                    ]
                    return not any(marker in normalized for marker in confirmation_markers)
                if result_status == "success":
                    wrong_success_markers = [
                        "実行してくれ",
                        "やってくれ",
                        "お願い",
                        "まだ",
                        "確認",
                        "承認",
                        "許可",
                        "やるなら",
                        "進めるなら",
                    ]
                    if any(marker in normalized for marker in wrong_success_markers):
                        return True
                    success_markers = [
                        "受け付け",
                        "受付",
                        "送った",
                        "出した",
                        "通った",
                        "できた",
                        "やった",
                        "完了",
                        "動かした",
                        "つけた",
                        "消した",
                        "開けた",
                        "閉めた",
                        "止めた",
                        "開始",
                        "戻した",
                        "一時停止",
                        "済み",
                        "済ん",
                    ]
                    return not any(marker in visible for marker in success_markers)
                return False


            def _fallback_user_reply(result: dict, result_status: str, decision: str, action_id: str) -> str:
                label = str(result.get("label") or action_id or "その操作").strip()
                message = str(result.get("bridge_message") or "").strip()
                if result_status == "success":
                    if message:
                        return f"[happy]{message.rstrip('。.!！')}。"
                    return f"[happy]{label}、操作は受け付けたぜ。"
                if result_status == "confirmation_required":
                    return f"[neutral][motion:think]{label}だな。まだ実行してねえぞ。やるなら「お願い」か「OK」って言ってくれ。"
                if decision == "retry_ai":
                    return "[neutral]ちょい引っかかったな。同じ件でもう一回だけ試すぜ。"
                return ""


            def main(text: str, result_json: str, result_confirmation_token: str = "", environment_body: str = "") -> dict:
                decision_data = _loads(text)
                result = _loads(result_json)
                environment = _environment_from_body(environment_body)
                room_light = _room_light_query(environment)

                issue_id = str(decision_data.get("issue_id") or result.get("issue_id") or "")
                attempt = _as_int(decision_data.get("attempt") or result.get("attempt"), 1)
                result_status = str(result.get("status") or "unknown")
                bridge_status = str(result.get("bridge_status") or result.get("raw", {}).get("status") or "")
                action_id = str(decision_data.get("action_id") or result.get("action_id") or "")
                decision = str(decision_data.get("decision") or "").strip()
                issue_status = str(decision_data.get("issue_status") or "").strip()
                next_input = str(decision_data.get("next_input") or "").strip()
                user_reply = str(decision_data.get("user_reply") or "").strip()
                reason = str(decision_data.get("reason") or "").strip()
                confirmed = _as_bool(decision_data.get("confirmed"))
                confirmation_token = str(result_confirmation_token or decision_data.get("confirmation_token") or "").strip()
                config_or_bridge_error = _is_config_or_bridge_error(result, bridge_status)

                if config_or_bridge_error:
                    decision = "ask_user"
                    issue_status = "need_user"
                    next_input = ""
                    confirmation_token = ""
                    user_reply = user_reply or "[sad][motion:shrug]ホームコントロールの認証か接続で止まってるな。HOME_CONTROL_API_TOKENとbridgeの起動状態を確認してくれ。"
                elif result_status == "success":
                    decision = "finish"
                    issue_status = "resolved"
                    next_input = ""
                    confirmation_token = ""
                elif result_status == "confirmation_required":
                    decision = "ask_user"
                    issue_status = "need_user"
                    next_input = ""
                elif (
                    result_status == "error"
                    and attempt < MAX_ATTEMPTS
                    and _sounds_like_retry(" ".join([decision, issue_status, next_input, user_reply, reason]))
                ):
                    decision = "retry_ai"
                elif decision not in ALLOWED_DECISIONS:
                    decision = "retry_ai" if attempt < MAX_ATTEMPTS else "ask_user"

                if attempt >= MAX_ATTEMPTS and decision == "retry_ai":
                    decision = "ask_user"
                    next_input = ""
                    user_reply = user_reply or "[sad][motion:shrug]3回試したけど通らねえな。状況をもう少し教えてくれ。"

                if decision == "retry_ai":
                    issue_status = "retrying"
                    confirmation_token = ""
                    if not next_input:
                        next_input = f"{action_id} を同じissue_idで再試行"
                elif decision == "ask_user":
                    issue_status = "need_user"
                    next_input = ""
                elif issue_status not in ALLOWED_STATUSES:
                    issue_status = "closed" if decision == "finish" else "failed"
                    if issue_status in {"closed", "failed"}:
                        confirmation_token = ""

                action_started_at = datetime.now(timezone.utc).isoformat() if decision == "retry_ai" else ""
                fallback_reply = _fallback_user_reply(result, result_status, decision, action_id)
                if fallback_reply and _needs_guarded_reply(user_reply, result_status):
                    user_reply = fallback_reply
                elif not user_reply:
                    if result_status == "success":
                        user_reply = "[happy]よし、操作は受け付けたぜ。"
                    elif result_status == "confirmation_required":
                        user_reply = "[neutral][motion:think]まだ実行してねえぞ。やるなら「はい、実行して」って言ってくれ。"
                    elif decision == "retry_ai":
                        user_reply = "[neutral]ちょい引っかかったな。同じ件でもう一回だけ試すぜ。"

                user_reply = _normalize_motion_tags(user_reply)
                pending_state_query_id = ""
                pending_state_query_json = ""
                if _post_action_feedback_needed(action_id, result_status, decision, room_light, environment):
                    user_reply = _append_post_action_feedback_prompt(user_reply, action_id, room_light)
                    pending_state_query_id, pending_state_query_json = _build_post_action_pending(action_id, issue_id, room_light, environment)
                elif _post_action_wait_timed_out(action_id, result_status, decision, environment):
                    user_reply = _append_post_action_wait_note(user_reply, environment)

                issue_summary = json.dumps(
                    {
                        "issue_id": issue_id,
                        "attempt": attempt,
                        "result_status": result_status,
                        "bridge_status": bridge_status,
                        "decision": decision,
                        "issue_status": issue_status,
                        "action_id": action_id,
                        "next_input": next_input,
                        "action_started_at": action_started_at,
                        "confirmation_token_present": bool(confirmation_token),
                        "post_action_feedback_pending": bool(pending_state_query_json),
                    },
                    ensure_ascii=False,
                )
                issue_event = json.dumps(
                    {
                        "event": "attempt_evaluated",
                        "issue_id": issue_id,
                        "attempt": attempt,
                        "result_status": result_status,
                        "bridge_status": bridge_status,
                        "decision": decision,
                        "issue_status": issue_status,
                        "action_id": action_id,
                        "action_started_at": action_started_at,
                        "confirmation_token_present": bool(confirmation_token),
                        "post_action_feedback_pending": bool(pending_state_query_json),
                    },
                    ensure_ascii=False,
                )

                return {
                    "issue_id": issue_id,
                    "attempt": attempt,
                    "next_attempt": min(attempt + 1, MAX_ATTEMPTS),
                    "result_status": result_status,
                    "decision": decision,
                    "issue_status": issue_status,
                    "user_reply": user_reply,
                    "next_input": next_input,
                    "action_id": action_id,
                    "confirmed": confirmed,
                    "confirmation_token": confirmation_token,
                    "action_started_at": action_started_at,
                    "pending_state_query_id": pending_state_query_id,
                    "pending_state_query_json": pending_state_query_json,
                    "issue_summary": issue_summary,
                    "issue_event": issue_event,
                    "raw_decision_json": json.dumps(decision_data, ensure_ascii=False),
                }
