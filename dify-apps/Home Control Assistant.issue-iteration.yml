app:
  description: Immediate acknowledgement, issue_id tracking, and up to 3 AI-side retries for home-control actions.
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: Home Control Assistant Issue Iteration
  use_icon_as_answer_icon: false
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/openai:0.3.8@592c8252795b5f75807de2d609a03196ed02596b409f7642b4a07548c7ff57ef
      version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables:
    - description: 現在処理中または直近の家電操作Issue ID
      id: 2a3c3c7c-a47a-4461-9668-24473681301c
      name: active_issue_id
      selector:
        - conversation
        - active_issue_id
      value: ''
      value_type: string
    - description: active_issue_id の状態
      id: 1a6607b1-04bc-4f67-b446-fefe20316b59
      name: active_issue_status
      selector:
        - conversation
        - active_issue_status
      value: resolved
      value_type: string
    - description: active_issue_id に紐づく直近の action_id
      id: c3237d2d-4a5e-4724-81fa-7f6409ab5b52
      name: active_issue_action_id
      selector:
        - conversation
        - active_issue_action_id
      value: ''
      value_type: string
    - description: active_issue_id の試行回数
      id: 2dae2b4c-f0d8-4c9a-a8db-7d8eed8073eb
      name: active_issue_attempts
      selector:
        - conversation
        - active_issue_attempts
      value: 0
      value_type: number
    - description: AI側が次回再試行に使う入力
      id: d6fdbd58-eab3-482f-a1a2-1176a7872562
      name: active_issue_next_input
      selector:
        - conversation
        - active_issue_next_input
      value: ''
      value_type: string
    - description: 確認付き家電操作でbridgeから返された一回限りのconfirmation_token
      id: f541bf69-1ebd-42d2-96cc-6b4a3af85c1d
      name: active_confirmation_token
      selector:
        - conversation
        - active_confirmation_token
      value: ''
      value_type: string
    - description: active_issue_id の直近サマリJSON
      id: 3b8b1c5d-a857-47f0-ad46-58d4fea9cf57
      name: active_issue_summary
      selector:
        - conversation
        - active_issue_summary
      value: ''
      value_type: string
    - description: 家電操作Issueのイベント履歴
      id: b2f75ba3-a618-453e-b41c-8c383c86cae9
      name: issue_history
      selector:
        - conversation
        - issue_history
      value: []
      value_type: array[string]
    - description: ユーザー確認待ちの直近状態照会ID
      id: 8b7c2d0f-a0b4-4c12-84ad-0d77c4af0b0d
      name: pending_state_query_id
      selector:
        - conversation
        - pending_state_query_id
      value: ''
      value_type: string
    - description: ユーザー確認待ちの直近状態照会JSON
      id: bbf4c1de-b399-4b41-8b23-a5725db073fe
      name: pending_state_query_json
      selector:
        - conversation
        - pending_state_query_json
      value: ''
      value_type: string
  environment_variables:
    - description: Home Assistant bridge API token. Set this in Dify after import; do not commit the real value.
      id: 8fe8e5f3-91b9-44fa-94dc-66b6c2a6c501
      name: HOME_CONTROL_API_TOKEN
      selector:
        - env
        - HOME_CONTROL_API_TOKEN
      value: ''
      value_type: secret
    - description: Environment state server current snapshot endpoint.
      id: 1ac5c01b-d1e0-4d5f-96b1-695964b8ec1a
      name: ENVIRONMENT_STATE_URL
      selector:
        - env
        - ENVIRONMENT_STATE_URL
      value: http://host.docker.internal:8790/environment/current
      value_type: string
    - description: Environment state server relation endpoint. Stores non-authoritative links between Dify issues and Home Assistant ids.
      id: 6c2f5c92-00a2-4f40-bf21-8e096589d0f8
      name: ENVIRONMENT_RELATIONS_URL
      selector:
        - env
        - ENVIRONMENT_RELATIONS_URL
      value: http://host.docker.internal:8790/environment/relations
      value_type: string
    - description: Environment state server feedback endpoint for user-labeled state query corrections.
      id: 9d91b638-4c57-4db5-a427-45b8d6e42d31
      name: ENVIRONMENT_FEEDBACK_URL
      selector:
        - env
        - ENVIRONMENT_FEEDBACK_URL
      value: http://host.docker.internal:8790/feedback/state-query
      value_type: string
  features:
    file_upload:
      allowed_file_extensions:
        - .JPG
        - .JPEG
        - .PNG
        - .GIF
        - .WEBP
        - .SVG
      allowed_file_types:
        - image
      allowed_file_upload_methods:
        - local_file
        - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
