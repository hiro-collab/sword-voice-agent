            HCA_WORKFLOW_VERSION = "hca-issue-iteration-state-feedback-20260507-05"
            DIAGNOSTIC_RE = re.compile(r"(__hca_diagnostic__|hca_diagnostic|hca診断|dify診断|ワークフロー診断)", re.I)
