          : json.dumps(answer, ensure_ascii=False),\n        \"status\": status,\n        \"issue_id\": issue_id,\n      \
          \  \"attempt\": ATTEMPT,\n        \"action_id\": response_action_id,\n        \"label\": str(label),\n        \"\
          bridge_message\": str(message),\n        \"raw_body\": json.dumps(data, ensure_ascii=False),\n    }\n"
