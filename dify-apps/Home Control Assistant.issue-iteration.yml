    - data:
        selected: false
        title: 結果整形 3
        type: code
        code: "import json\n\nATTEMPT = 3\n\n\ndef _loads(value):\n    if isinstance(value, dict):\n        return value\n\
          \    try:\n        parsed = json.loads(value or \"{}\")\n    except Exception:\n        return {\"raw\": value or\
          \ \"\"}\n    if isinstance(parsed, str):\n        try:\n            parsed = json.loads(parsed)\n        except\
          \ Exception:\n            return {\"raw\": parsed}\n    return parsed if isinstance(parsed, dict) else {\"raw\"\
          : parsed}\n\n\ndef main(body: str, issue_id: str, action_id: str) -> dict:\n    data = _loads(body)\n    message\
          \ = data.get(\"speak\") or data.get(\"message\") or data.get(\"error\") or \"\"\n    label = data.get(\"preview\"\
          , {}).get(\"label\") or data.get(\"label\") or data.get(\"action_id\") or action_id or \"その操作\"\n    response_action_id\
          \ = data.get(\"action_id\") or data.get(\"preview\", {}).get(\"action_id\") or action_id or \"\"\n\n    if data.get(\"\
          confirmation_required\") and not data.get(\"executed\"):\n        status = \"confirmation_required\"\n    elif data.get(\"\
          status\") in {\"success\", \"error\", \"unknown\"}:\n        status = data.get(\"status\")\n    elif data.get(\"\
          ok\") is False:\n        status = \"error\"\n    elif data.get(\"executed\") is True or data.get(\"ok\") is True:\n\
          \        status = \"success\"\n    else:\n        status = \"unknown\"\n\n    answer = {\n        \"issue_id\":\
          \ issue_id,\n        \"attempt\": ATTEMPT,\n        \"status\": status,\n        \"ok\": data.get(\"ok\"),\n   \
          \     \"executed\": data.get(\"executed\"),\n        \"confirmation_required\": data.get(\"confirmation_required\"\
          ),\n        \"action_id\": response_action_id,\n        \"label\": label,\n        \"bridge_message\": message,\n\
          \        \"request_id\": data.get(\"request_id\"),\n        \"raw\": data,\n    }\n    return {\n        \"answer\"\
          : json.dumps(answer, ensure_ascii=False),\n        \"status\": status,\n        \"issue_id\": issue_id,\n      \
          \  \"attempt\": ATTEMPT,\n        \"action_id\": response_action_id,\n        \"label\": str(label),\n        \"\
          bridge_message\": str(message),\n        \"raw_body\": json.dumps(data, ensure_ascii=False),\n    }\n"
