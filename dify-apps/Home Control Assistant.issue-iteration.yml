                }


            def _new_issue_id() -> str:
                stamp = datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S")
                return f"HCA-{stamp}-{uuid.uuid4().hex[:6]}"


            def _compact_text(value: str) -> str:
                return re.sub(r"\s+", "", value or "").lower()


            def _action_alias_candidates(action):
                aliases = action.get("aliases") if isinstance(action, dict) else []
                candidates = [str(alias) for alias in aliases if str(alias or "").strip()]
                for key in ("label", "pre_action_phrase"):
                    value = str(action.get(key) or "").strip()
                    if value:
                        candidates.append(value)
                target = str(action.get("target_label") or "").strip()
                verb = str(action.get("verb") or "").strip()
                if target and verb:
                    candidates.extend([f"{target}を{verb}", f"{target}{verb}", f"{target}の{verb}"])
                return sorted(set(candidates), key=lambda value: len(_compact_text(value)), reverse=True)


            def _infer_action_from_environment(user_text, actions_by_id):
                text = _compact_text(user_text)
                if not text or not actions_by_id:
                    return "none"
                for action_id, action in actions_by_id.items():
                    for alias in _action_alias_candidates(action):
                        alias_text = _compact_text(alias)
                        if len(alias_text) >= 3 and (alias_text in text or text in alias_text):
                            return action_id
                return "none"


            def _infer_action_from_user_text(user_text: str) -> str:
                text = _compact_text(user_text)
                if not text:
                    return "none"

                door_target = any(marker in text for marker in ("中扉", "扉", "ドア", "door"))
                if door_target:
                    if any(marker in text for marker in ("止め", "停止", "ストップ", "中止", "stop")):
                        return "door_stop"
                    if any(marker in text for marker in ("閉め", "閉じ", "閉ま", "しめ", "とじ", "close")):
                        return "door_close"
                    if any(marker in text for marker in ("開け", "開い", "開く", "あけ", "ひら", "open")):
                        return "door_open"

                return "none"


            def _action_phrase(action_id, action=None):
                if isinstance(action, dict):
                    phrase = str(action.get("pre_action_phrase") or action.get("label") or "").strip()
                    if phrase:
                        return phrase
                return ACTION_LABELS.get(action_id, "その操作")


            def _action_is_noop(action):
                if not isinstance(action, dict):
                    return False
                reason = str(action.get("reason") or "")
                return bool(action.get("noop")) or (action.get("available") is False and reason.startswith("already_"))


            def _noop_reply(action, action_id):
                if not isinstance(action, dict):
                    label = ACTION_LABELS.get(action_id, "その操作")
                    return f"[relaxed]{label}はもう済んでるみたいだな。触らずにおくぜ。"
                target = str(action.get("target_label") or action.get("label") or ACTION_LABELS.get(action_id, "その操作")).strip()
                reason = str(action.get("reason") or "")
                if reason.startswith("already_"):
                    state_text = ALREADY_STATE_TEXT.get(reason.removeprefix("already_"), "その状態")
                    return f"[relaxed]{target}はもう{state_text}な。触らずにおくぜ。"
                reason_text = str(action.get("reason_text") or "").rstrip("。")
                if reason_text:
                    return f"[relaxed]{reason_text}。こっちは無理に動かさねえぞ。"
                return f"[relaxed]{target}は今の状態だと操作いらなそうだな。触らずにおくぜ。"


            def _strip_tags(text: str) -> str:
                return re.sub(r"\[[^\]]+\]", "", text or "").strip()


            KNOWN_MOTION_TAGS = {
                "think",
                "cheer",
                "cross",
                "mouth_cover",
                "crossed_arms",
                "bow",
                "shrug",
                "shy",
                "wave",
                "clap",
            }


            def _normalize_motion_tags(text: str) -> str:
                def normalize(match):
                    name = str(match.group(1) or "").lower()
                    if name in KNOWN_MOTION_TAGS:
                        return f"[motion:{name}]"
                    return match.group(0)

                normalized = re.sub(r"\[motion:([A-Za-z_][A-Za-z0-9_-]*)\]", normalize, text or "", flags=re.I)
                return re.sub(r"\[([A-Za-z_][A-Za-z0-9_-]*)\]", normalize, normalized)


            def _tag_prefix(text: str, default: str = "[neutral]") -> str:
                match = re.match(
                    r"^(\[(neutral|happy|angry|sad|relaxed|surprised)\](\[motion:(think|cheer|cross|mouth_cover|crossed_arms|bow|shrug|shy|wave|clap)\])?)",
                    text or "",
                )
                return match.group(1) if match else default


            def _fallback_pre_action_text(action_id, confirmed=False, action=None):
                if action_id == "none":
                    return ""
                if confirmed:
                    return "[happy]OK、続きやるぞ。"
                label = _action_phrase(action_id, action)
                return f"[neutral]{label}か。わかった、やるよ。"


            def _fallback_ack_text(user_text, action_id):
                if action_id and action_id != "none":
                    candidates = [
                        "[neutral]はいよ。",
                        "[relaxed]まかせな。",
                        "[neutral]おう、見るぞ。",
                        "[happy]任せとけ。",
                        "[neutral]ちょい待ちな。",
                    ]
                else:
                    candidates = [
                        "[relaxed]ふんふん。",
                        "[neutral]なるほどな。",
                        "[relaxed]ほうほう。",
                        "[neutral]うんうん。",
                    ]
                seed = sum(ord(ch) for ch in f"{action_id}:{user_text or ''}")
                return candidates[seed % len(candidates)]


            def _sanitize_pre_action_text(value, action_id, confirmed=False, action=None):
                if action_id == "none":
                    return ""
                pre_action_text = _normalize_motion_tags((value or "").strip())
                spoken = _strip_tags(pre_action_text)
                tag_re = re.compile(
                    r"^\[(neutral|happy|angry|sad|relaxed|surprised)\](\[motion:(think|cheer|cross|mouth_cover|crossed_arms|bow|shrug|shy|wave|clap)\])?.+"
                )
                done_words = (
                    "実行した",
                    "実行しました",
                    "できた",
                    "できました",
                    "完了",
                    "済んだ",
                    "開けた",
                    "開けました",
                    "閉めた",
                    "閉めました",
                    "消した",
                    "消しました",
                    "つけた",
                    "つけました",
                    "止めた",
                    "止めました",
                )
                unsafe = (
                    not pre_action_text
                    or not tag_re.match(pre_action_text)
                    or spoken.count("。") + spoken.count("！") + spoken.count("？") > 2
                    or any(word in spoken for word in done_words)
                )
                if unsafe:
                    return _fallback_pre_action_text(action_id, confirmed, action)
                if len(spoken) > 40:
                    prefix = _tag_prefix(pre_action_text)
                    trimmed = spoken[:40].rstrip("、。,.!?！？ ")
                    return prefix + (trimmed + "…" if trimmed else "")
                return pre_action_text


            def main(
                text: str,
                user_text: str,
                active_issue_id: str = "",
                active_issue_status: str = "",
                active_issue_attempts=0,
                active_issue_action_id: str = "",
                active_issue_next_input: str = "",
                active_confirmation_token: str = "",
                environment_body: str = "",
                environment_status_code=0,
                pending_state_query_id: str = "",
                pending_state_query_json: str = "",
                conversation_id: str = "",
            ) -> dict:
                raw_text = (text or "").strip()
                raw_lower = raw_text.lower()
                data = _loads_json(raw_text)
                environment, environment_actions = _environment_actions(environment_body)
                is_diagnostic = _detect_diagnostic_query(user_text)
                is_state_feedback_expired = _state_query_feedback_expired(user_text, pending_state_query_json, pending_state_query_id)
                state_feedback = _state_query_feedback(user_text, pending_state_query_json, pending_state_query_id, environment, conversation_id)
                is_state_feedback = bool(state_feedback)
                state_query_id = "room_light" if _detect_room_light_state_query(user_text) else ""
                if is_diagnostic:
                    state_query_id = "room_light"
                if is_state_feedback or is_state_feedback_expired:
                    state_query_id = ""
                state_query_reply = _state_query_reply(state_query_id, environment) if state_query_id else ""
                environment_action_ids = set(environment_actions.keys())
                allowed_actions = (environment_action_ids | {"none"}) if environment_action_ids else ALLOWED_ACTIONS

                action_text = str(data.get("action_id") or data.get("action") or raw_lower).lower()
                match = ACTION_RE.search(action_text)
                action_id = match.group(1) if match else "none"
                if action_id not in allowed_actions:
                    action_id = "none"

                inferred_action_id = _infer_action_from_environment(user_text, environment_actions)
                if inferred_action_id == "none":
                    inferred_action_id = _infer_action_from_user_text(user_text)
                if inferred_action_id != "none":
                    action_id = inferred_action_id
                if state_query_id or is_diagnostic or is_state_feedback or is_state_feedback_expired:
                    action_id = "none"

                confirmed = _as_bool(data.get("confirmed"))
                if not confirmed and not data:
                    confirmed = bool(TRUE_RE.search(raw_lower))
                if state_query_id or is_diagnostic or is_state_feedback or is_state_feedback_expired:
                    confirmed = False

                unresolved = (active_issue_status or "").strip() in UNRESOLVED and bool(active_issue_id)
                if not state_query_id and not is_state_feedback and not is_state_feedback_expired and action_id == "none" and unresolved and active_issue_action_id and CONFIRM_RE.search(user_text or ""):
                    action_id = active_issue_action_id
                    confirmed = True

                if action_id == "none":
                    confirmed = False

                selected_action = environment_actions.get(action_id)
                is_requested_action = action_id != "none"
                should_execute = is_requested_action and not _action_is_noop(selected_action)
                inherited_issue = bool(
                    should_execute
                    and unresolved
                    and active_issue_action_id
                    and action_id == active_issue_action_id
                )
                issue_id = active_issue_id if inherited_issue else (_new_issue_id() if should_execute else "")
                attempt_start = _as_int(active_issue_attempts if inherited_issue else 0, 0)
                process_input = (user_text or "").strip()
                confirmation_token = (active_confirmation_token or "").strip() if confirmed and inherited_issue else ""
                ack_text = _normalize_motion_tags(str(data.get("ack_text") or data.get("text") or "").strip())
                prohibited_fragments = (
                    "聞こえたぜ",
                    "受け取ったぜ",
                    "考えるぜ",
                    "確認するな",
                    "確認するぞ",
                    "すぐ確認するぜ",
                )
                generic_ack = ack_text in {
                    "[neutral]おう、聞こえたぜ。",
                    "[neutral]おう、聞こえたぜ。すぐ確認するな。",
                    "[neutral]おう、聞こえたぜ。ちょっと考えるな。",
                    "[neutral]了解。",
                    "[neutral]確認するぞ。",
                    "[neutral]はいはい。確認するぞ。",
                } or any(fragment in ack_text for fragment in prohibited_fragments)

                tag_re = re.compile(r"^\[(neutral|happy|angry|sad|relaxed|surprised)\](\[motion:(think|cheer|cross|mouth_cover|crossed_arms|bow|shrug|shy|wave|clap)\])?.+")
                spoken_ack = re.sub(r"\[[^\]]+\]", "", ack_text).strip()
                hard_unsafe_ack = (
                    not ack_text
                    or not tag_re.match(ack_text)
                    or spoken_ack.count("。") + spoken_ack.count("！") + spoken_ack.count("？") > 1
                    or any(word in spoken_ack for word in ("実行した", "実行しました", "できた", "できました", "完了", "消した", "消しました", "つけた", "つけました"))
                )
                if generic_ack or hard_unsafe_ack:
                    ack_text = _fallback_ack_text(user_text, action_id)
                elif len(spoken_ack) > 20:
                    tag_match = re.match(r"^(\[(neutral|happy|angry|sad|relaxed|surprised)\](\[motion:(think|cheer|cross|mouth_cover|crossed_arms|bow|shrug|shy|wave|clap)\])?)", ack_text)
                    tag_prefix = tag_match.group(1) if tag_match else "[neutral]"
                    trimmed_ack = spoken_ack[:20].rstrip("、。,.!?！？ ")
                    ack_text = tag_prefix + (trimmed_ack + "…" if trimmed_ack else "")

                if len(ack_text) > 80:
                    ack_text = ack_text[:77] + "..."

                pre_action_text = _sanitize_pre_action_text(
                    str(data.get("pre_action_text") or data.get("pre_execute_text") or "").strip(),
                    action_id,
                    confirmed,
                    selected_action,
                )
                non_execute_reply = _normalize_motion_tags(
                    _feedback_reply(state_feedback.get("user_label"))
                    if is_state_feedback
                    else (_feedback_expired_reply() if is_state_feedback_expired else state_query_reply)
                )
                if is_requested_action and not should_execute:
                    pre_action_text = ""
                    confirmation_token = ""
                    non_execute_reply = _normalize_motion_tags(_noop_reply(selected_action, action_id))
                diagnostic_json = ""
                if is_diagnostic:
                    pre_action_text = ""
                    confirmation_token = ""
                    diagnostic_json = json.dumps(_diagnostic_payload(environment, environment_status_code), ensure_ascii=False, sort_keys=True)
                    ack_text = f"[neutral]HCA_DIAGNOSTIC_JSON {diagnostic_json}"
                    non_execute_reply = ack_text

                pending_state_query_id_next, pending_state_query_json_next = _build_pending_state_query(
                    state_query_id,
                    environment,
                    user_text,
                )
                if is_state_feedback or is_state_feedback_expired or should_execute or is_diagnostic:
                    pending_state_query_id_next = ""
                    pending_state_query_json_next = ""
                state_query_feedback_json = json.dumps(state_feedback, ensure_ascii=False, sort_keys=True) if is_state_feedback else ""

                action_started_at = datetime.now(timezone.utc).isoformat() if should_execute else ""
                issue_status_initial = "open" if should_execute else ("resolved" if non_execute_reply else (active_issue_status or ""))
                issue_summary = json.dumps(
                    {
                        "issue_id": issue_id,
                        "status": issue_status_initial,
                        "action_id": action_id,
                        "confirmed": confirmed,
                        "attempt_start": attempt_start,
                        "inherited": inherited_issue,
                        "user_text": process_input,
                        "previous_next_input": active_issue_next_input or "",
                        "confirmation_token_present": bool(confirmation_token),
                        "should_execute": should_execute,
                        "environment_snapshot_id": environment.get("snapshot_id") or "",
                        "environment_capabilities": environment.get("capabilities") or {},
                        "action_available": selected_action.get("available") if isinstance(selected_action, dict) else None,
                        "action_noop": selected_action.get("noop") if isinstance(selected_action, dict) else None,
                        "action_reason": selected_action.get("reason") if isinstance(selected_action, dict) else "",
                        "action_reason_text": selected_action.get("reason_text") if isinstance(selected_action, dict) else "",
                        "state_query_id": state_query_id,
                        "state_query_present": bool(_room_light_query(environment)) if state_query_id == "room_light" else False,
                        "state_query_keys": sorted((environment.get("state_queries") or {}).keys()) if isinstance(environment.get("state_queries"), dict) else [],
                        "is_state_feedback": is_state_feedback,
                        "is_state_feedback_expired": is_state_feedback_expired,
                        "state_feedback_label": state_feedback.get("user_label") if is_state_feedback else "",
                        "pending_state_query_id_next": pending_state_query_id_next,
                        "workflow_version": HCA_WORKFLOW_VERSION,
                        "diagnostic": is_diagnostic,
                        "environment_status_code": _as_int(environment_status_code, 0),
                        "action_started_at": action_started_at,
                    },
                    ensure_ascii=False,
                )
                issue_event = json.dumps(
                    {
                        "event": "issue_started" if should_execute and not inherited_issue else ("issue_continued" if should_execute else ("state_query_feedback" if is_state_feedback else ("state_query_feedback_expired" if is_state_feedback_expired else ("state_query_started" if state_query_id else "issue_skipped_noop")))),
                        "issue_id": issue_id,
                        "status": issue_status_initial,
                        "action_id": action_id,
                        "confirmed": confirmed,
                        "attempt": attempt_start,
                        "environment_snapshot_id": environment.get("snapshot_id") or "",
                        "state_query_id": state_query_id or state_feedback.get("state_query_id", ""),
                        "state_feedback_label": state_feedback.get("user_label") if is_state_feedback else "",
                        "action_started_at": action_started_at,
                    },
                    ensure_ascii=False,
                )

                return {
                    "action_id": action_id,
                    "confirmed": confirmed,
                    "is_action": should_execute,
                    "ack_text": ack_text,
                    "pre_action_text": pre_action_text,
                    "non_execute_reply": non_execute_reply,
                    "process_input": process_input,
                    "issue_id": issue_id,
                    "issue_status_initial": issue_status_initial,
                    "attempt_start": attempt_start,
                    "inherited_issue": inherited_issue,
                    "next_input_initial": "",
                    "confirmation_token": confirmation_token,
                    "issue_summary": issue_summary,
                    "issue_event": issue_event,
                    "raw_llm_json": raw_text,
                    "environment_snapshot_id": str(environment.get("snapshot_id") or ""),
                    "selected_action_json": json.dumps(selected_action or {}, ensure_ascii=False),
                    "action_available": bool(selected_action.get("available")) if isinstance(selected_action, dict) else False,
                    "action_noop": bool(selected_action.get("noop")) if isinstance(selected_action, dict) else False,
                    "action_reason": str(selected_action.get("reason") or "") if isinstance(selected_action, dict) else "",
                    "state_query_id": state_query_id,
                    "state_query_json": json.dumps(_room_light_query(environment) if state_query_id == "room_light" else {}, ensure_ascii=False),
                    "pending_state_query_id": pending_state_query_id_next,
                    "pending_state_query_json": pending_state_query_json_next,
                    "is_state_feedback": is_state_feedback,
                    "is_state_feedback_expired": is_state_feedback_expired,
                    "state_query_feedback_json": state_query_feedback_json,
                    "workflow_version": HCA_WORKFLOW_VERSION,
                    "action_started_at": action_started_at,
                    "diagnostic_json": diagnostic_json,
                }
