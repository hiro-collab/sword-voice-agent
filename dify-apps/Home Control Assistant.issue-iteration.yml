                room_light = _room_light_query(environment)
                light = _light_appliance_state(environment)
                return {
                    "environment_status_code": _as_int(environment_status_code, 0),
                    "environment_snapshot_id": str(environment.get("snapshot_id") or "") if isinstance(environment, dict) else "",
                    "environment_available": environment.get("available") if isinstance(environment, dict) else None,
                    "environment_stale": environment.get("stale") if isinstance(environment, dict) else None,
                    "environment_detail": str(environment.get("detail") or environment.get("error") or "") if isinstance(environment, dict) else "",
                    "environment_keys": sorted(environment.keys()) if isinstance(environment, dict) else [],
                    "state_query_keys": sorted(state_queries.keys()),
                    "state_query_present": bool(room_light),
                    "room_light": {
                        "available": room_light.get("available") if room_light else None,
                        "stale": room_light.get("stale") if room_light else None,
                        "state": room_light.get("state") if room_light else "",
                        "confidence_label": room_light.get("confidence_label") if room_light else "",
                        "authority": room_light.get("authority") if room_light else "",
                        "answer_hint": room_light.get("answer_hint") if room_light else "",
                        "learning": room_light.get("learning") if room_light and isinstance(room_light.get("learning"), dict) else {},
                    },
                    "light_appliance": {
                        "state": light.get("state") if light else "",
                        "stale": light.get("stale") if light else None,
                        "source": light.get("source") if light else "",
                        "updated_at": light.get("updated_at") if light else "",
                        "action_id": light.get("action_id") if light else "",
                    },
                }


            def _diagnostic_payload(environment: dict, environment_status_code=0) -> dict:
                return {
                    "type": "hca_dify_workflow_diagnostic",
                    "workflow_version": HCA_WORKFLOW_VERSION,
                    "feedback_contract": {
                        "state_query_feedback": True,
