          \ \"action_id\": action_id,\n            \"next_input\": next_input,\n        },\n        ensure_ascii=False,\n\
          \    )\n    issue_event = json.dumps(\n        {\n            \"event\": \"attempt_evaluated\",\n            \"\
          issue_id\": issue_id,\n            \"attempt\": attempt,\n            \"result_status\": result_status,\n      \
          \      \"decision\": decision,\n            \"issue_status\": issue_status,\n            \"action_id\": action_id,\n\
