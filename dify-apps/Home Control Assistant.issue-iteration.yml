          confirmation_required\") and not data.get(\"executed\"):\n        status = \"confirmation_required\"\n    elif data.get(\"\
          status\") in {\"success\", \"error\", \"unknown\"}:\n        status = data.get(\"status\")\n    elif data.get(\"\
          ok\") is False:\n        status = \"error\"\n    elif data.get(\"executed\") is True or data.get(\"ok\") is True:\n\
          \        status = \"success\"\n    else:\n        status = \"unknown\"\n\n    answer = {\n        \"issue_id\":\
          \ issue_id,\n        \"attempt\": ATTEMPT,\n        \"status\": status,\n        \"ok\": data.get(\"ok\"),\n   \
          \     \"executed\": data.get(\"executed\"),\n        \"confirmation_required\": data.get(\"confirmation_required\"\
          ),\n        \"action_id\": response_action_id,\n        \"label\": label,\n        \"bridge_message\": message,\n\
