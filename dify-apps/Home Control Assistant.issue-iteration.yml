      - data:
          selected: false
          title: 結果整形 3
          type: code
          code: |
            import json

            ATTEMPT = 3


            def _loads(value):
                if isinstance(value, dict):
                    return value
                try:
                    parsed = json.loads(value or "{}")
                except Exception:
                    return {"raw": value or ""}
                if isinstance(parsed, str):
                    try:
                        parsed = json.loads(parsed)
                    except Exception:
                        return {"raw": parsed}
                return parsed if isinstance(parsed, dict) else {"raw": parsed}


            def _sanitize_raw(data: dict) -> dict:
                sanitized = dict(data)
                if sanitized.get("confirmation_token"):
                    sanitized["confirmation_token"] = "[stored]"
                return sanitized


            def main(body: str, issue_id: str, action_id: str) -> dict:
                data = _loads(body)
                raw_sanitized = _sanitize_raw(data)
                message = data.get("speak") or data.get("message") or data.get("error") or ""
                label = data.get("preview", {}).get("label") or data.get("label") or data.get("action_id") or action_id or "その操作"
                response_action_id = data.get("action_id") or data.get("preview", {}).get("action_id") or action_id or ""
                bridge_status = str(data.get("bridge_status") or data.get("status") or "").strip()
                confirmation_token = str(data.get("confirmation_token") or "")

                if bridge_status == "confirmation_required" or (data.get("confirmation_required") and not data.get("executed")):
                    status = "confirmation_required"
                elif bridge_status in {"submitted", "duplicate"} or data.get("executed") is True:
                    status = "success"
                elif bridge_status in {"failed", "error"} or data.get("ok") is False or data.get("detail"):
                    status = "error"
                elif bridge_status in {"success", "unknown"}:
                    status = bridge_status
                elif data.get("ok") is True:
                    status = "success"
                else:
                    status = "unknown"

                answer = {
                    "issue_id": issue_id,
                    "attempt": ATTEMPT,
                    "status": status,
                    "bridge_status": bridge_status,
                    "ok": data.get("ok"),
                    "executed": data.get("executed"),
                    "confirmation_required": data.get("confirmation_required"),
                    "confirmation_token_present": bool(confirmation_token),
                    "action_id": response_action_id,
                    "label": label,
                    "bridge_message": message,
                    "request_id": data.get("request_id"),
                    "execution_id": data.get("execution_id"),
                    "issued_at": data.get("issued_at"),
                    "domain": data.get("domain"),
                    "service": data.get("service"),
                    "entity_id": data.get("entity_id"),
                    "expected_state": data.get("expected_state"),
                    "expected_effect": data.get("expected_effect"),
                    "raw": raw_sanitized,
                }
                return {
                    "answer": json.dumps(answer, ensure_ascii=False),
                    "status": status,
                    "bridge_status": bridge_status,
                    "issue_id": issue_id,
                    "attempt": ATTEMPT,
                    "action_id": response_action_id,
                    "label": str(label),
                    "bridge_message": str(message),
                    "confirmation_token": confirmation_token,
                    "request_id": str(data.get("request_id") or ""),
                    "execution_id": str(data.get("execution_id") or ""),
                    "raw_body": json.dumps(raw_sanitized, ensure_ascii=False),
                }
          code_language: python3
          outputs:
            answer:
              children: null
              type: string
