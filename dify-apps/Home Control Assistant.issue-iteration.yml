        title: 判定JSON整形 3
        type: code
        code: "import json\nimport re\n\nMAX_ATTEMPTS = 3\nALLOWED_DECISIONS = {\"finish\", \"retry_ai\", \"ask_user\"}\n\
          ALLOWED_STATUSES = {\"resolved\", \"retrying\", \"need_user\", \"failed\", \"closed\"}\n\n\ndef _loads(raw: str)\
          \ -> dict:\n    if isinstance(raw, dict):\n        return raw\n    try:\n        parsed = json.loads(raw or \"{}\"\
          )\n    except Exception:\n        match = re.search(r\"\\{.*\\}\", raw or \"\", re.S)\n        if not match:\n \
          \           return {}\n        try:\n            parsed = json.loads(match.group(0))\n        except Exception:\n\
          \            return {}\n    return parsed if isinstance(parsed, dict) else {}\n\n\ndef _as_bool(value) -> bool:\n\
          \    if isinstance(value, bool):\n        return value\n    if isinstance(value, str):\n        return value.strip().lower()\
          \ in {\"true\", \"1\", \"yes\", \"y\"}\n    return False\n\n\ndef _as_int(value, default=1) -> int:\n    try:\n\
          \        return int(float(value))\n    except Exception:\n        return default\n\n\ndef main(text: str, result_json:\
          \ str) -> dict:\n    decision_data = _loads(text)\n    result = _loads(result_json)\n\n    issue_id = str(decision_data.get(\"\
          issue_id\") or result.get(\"issue_id\") or \"\")\n    attempt = _as_int(decision_data.get(\"attempt\") or result.get(\"\
          attempt\"), 1)\n    result_status = str(result.get(\"status\") or \"unknown\")\n    action_id = str(decision_data.get(\"\
          action_id\") or result.get(\"action_id\") or \"\")\n    decision = str(decision_data.get(\"decision\") or \"\").strip()\n\
          \    issue_status = str(decision_data.get(\"issue_status\") or \"\").strip()\n    next_input = str(decision_data.get(\"\
          next_input\") or \"\").strip()\n    user_reply = str(decision_data.get(\"user_reply\") or \"\").strip()\n    confirmed\
          \ = _as_bool(decision_data.get(\"confirmed\"))\n\n    if decision not in ALLOWED_DECISIONS:\n        if result_status\
          \ == \"success\":\n            decision = \"finish\"\n        elif result_status == \"confirmation_required\":\n\
          \            decision = \"ask_user\"\n        else:\n            decision = \"retry_ai\" if attempt < MAX_ATTEMPTS\
          \ else \"ask_user\"\n\n    if attempt >= MAX_ATTEMPTS and decision == \"retry_ai\":\n        decision = \"ask_user\"\
          \n        next_input = \"\"\n        user_reply = user_reply or \"[sad][motion:shrug]3回試したけど通らねえな。状況をもう少し教えてくれ。\"\
          \n\n    if result_status == \"success\":\n        decision = \"finish\"\n        issue_status = \"resolved\"\n \
          \       next_input = \"\"\n    elif decision == \"retry_ai\":\n        issue_status = \"retrying\"\n        if not\
          \ next_input:\n            next_input = f\"{action_id} を同じissue_idで再試行\"\n    elif decision == \"ask_user\":\n \
          \       issue_status = \"need_user\"\n        next_input = \"\"\n    elif issue_status not in ALLOWED_STATUSES:\n\
          \        issue_status = \"closed\" if decision == \"finish\" else \"failed\"\n\n    if not user_reply:\n       \
          \ if result_status == \"success\":\n            user_reply = \"[happy]よし、操作は通ったぜ。\"\n        elif result_status\
          \ == \"confirmation_required\":\n            user_reply = \"[neutral][motion:think]まだ実行してねえぞ。やるなら「はい、実行して」って言ってくれ。\"\
          \n        elif decision == \"retry_ai\":\n            user_reply = \"[neutral]ちょい引っかかったな。同じ件でもう一回だけ試すぜ。\"\n    \
          \    else:\n            user_reply = \"[sad][motion:shrug]うまく通らなかったな。もう一度言い方を変えて頼む。\"\n\n    issue_summary = json.dumps(\n\
          \        {\n            \"issue_id\": issue_id,\n            \"attempt\": attempt,\n            \"result_status\"\
          : result_status,\n            \"decision\": decision,\n            \"issue_status\": issue_status,\n           \
          \ \"action_id\": action_id,\n            \"next_input\": next_input,\n        },\n        ensure_ascii=False,\n\
          \    )\n    issue_event = json.dumps(\n        {\n            \"event\": \"attempt_evaluated\",\n            \"\
          issue_id\": issue_id,\n            \"attempt\": attempt,\n            \"result_status\": result_status,\n      \
          \      \"decision\": decision,\n            \"issue_status\": issue_status,\n            \"action_id\": action_id,\n\
          \        },\n        ensure_ascii=False,\n    )\n\n    return {\n        \"issue_id\": issue_id,\n        \"attempt\"\
          : attempt,\n        \"next_attempt\": min(attempt + 1, MAX_ATTEMPTS),\n        \"result_status\": result_status,\n\
          \        \"decision\": decision,\n        \"issue_status\": issue_status,\n        \"user_reply\": user_reply,\n\
          \        \"next_input\": next_input,\n        \"action_id\": action_id,\n        \"confirmed\": confirmed,\n   \
          \     \"issue_summary\": issue_summary,\n        \"issue_event\": issue_event,\n        \"raw_decision_json\": json.dumps(decision_data,\
          \ ensure_ascii=False),\n    }\n"
        code_language: python3
        outputs:
          issue_id:
            children: null
            type: string
          attempt:
            children: null
            type: number
          next_attempt:
            children: null
            type: number
          result_status:
            children: null
            type: string
          decision:
            children: null
