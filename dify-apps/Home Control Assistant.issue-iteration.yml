            def _loads_json(raw: str) -> dict:
                try:
                    parsed = json.loads(raw)
                except Exception:
                    match = re.search(r"\{.*\}", raw or "", re.S)
                    if not match:
                        return {}
                    try:
                        parsed = json.loads(match.group(0))
                    except Exception:
                        return {}
                if isinstance(parsed, str):
                    return _loads_json(parsed)
                return parsed if isinstance(parsed, dict) else {}


            def _unwrap_environment_payload(payload: dict) -> dict:
                if not isinstance(payload, dict):
                    return {}
                if isinstance(payload.get("state_queries"), dict) or isinstance(payload.get("actions"), list):
                    return payload
                for key in ("environment", "current", "data"):
                    nested = payload.get(key)
                    if isinstance(nested, dict) and (
                        isinstance(nested.get("state_queries"), dict)
                        or isinstance(nested.get("actions"), list)
                        or isinstance(nested.get("vision"), dict)
                    ):
                        return nested
                body = payload.get("body")
                if isinstance(body, str):
                    nested = _loads_json(body)
                    if nested:
                        return _unwrap_environment_payload(nested)
                return payload


            def _environment_actions(environment_body):
                environment = _unwrap_environment_payload(_loads_json(environment_body or ""))
                actions = environment.get("actions")
                if not isinstance(actions, list):
                    return environment, {}
                by_id = {}
                for action in actions:
                    if not isinstance(action, dict):
                        continue
                    action_id = str(action.get("action_id") or "").strip()
                    if action_id:
                        by_id[action_id] = action
                return environment, by_id


            def _as_bool(value) -> bool:
                if isinstance(value, bool):
                    return value
                if isinstance(value, str):
                    return value.strip().lower() in {"true", "1", "yes", "y"}
                return False


            def _as_int(value, default=0) -> int:
                try:
                    return int(float(value))
                except Exception:
                    return default


            def _detect_diagnostic_query(user_text: str) -> bool:
                return bool(DIAGNOSTIC_RE.search(user_text or ""))


            def _detect_room_light_state_query(user_text: str) -> bool:
                text = _compact_text(user_text)
                if not text:
                    return False
                command_markers = (
                    "つけて",
                    "付けて",
                    "点けて",
                    "消して",
                    "消しといて",
                    "オンにして",
                    "オフにして",
                    "入れて",
                    "切って",
                )
                if any(marker in text for marker in command_markers):
                    return False
                target_markers = ("電気", "照明", "ライト", "明かり", "あかり", "部屋")
                state_markers = (
                    "ついてる",
                    "ついている",
                    "ついてます",
                    "点いてる",
                    "点いている",
                    "点いてます",
                    "付いてる",
                    "付いている",
                    "付いてます",
                    "ついてない",
                    "点いてない",
                    "付いてない",
                    "点灯",
                    "消えてる",
                    "消えている",
                    "消えてます",
                    "消えています",
                    "消えてない",
                    "消灯",
                    "オン",
                    "オフ",
                    "明るい",
                    "明るさ",
                    "暗い",
                    "暗さ",
                    "状態",
                )
                if not any(marker in text for marker in target_markers):
                    return False
                return any(marker in text for marker in state_markers)


            def _room_light_query(environment: dict) -> dict:
                state_queries = environment.get("state_queries")
                if not isinstance(state_queries, dict):
                    return {}
                room_light = state_queries.get("room_light")
                return room_light if isinstance(room_light, dict) else {}


            def _room_light_feedback_label(user_text: str, pending=None) -> str:
                text = _compact_text(user_text)
                if not text:
                    return ""
                command_markers = (
                    "つけて",
                    "付けて",
                    "点けて",
                    "消して",
                    "消しといて",
                    "オンにして",
                    "オフにして",
                    "入れて",
                    "切って",
                    "やって",
                    "実行",
                )
                if any(marker in text for marker in command_markers):
                    return ""
                unknown_markers = ("わからない", "分からない", "知らない", "見えない", "見えてない", "判断できない")
                if any(marker in text for marker in unknown_markers):
                    return "unknown"
                daylight_markers = ("日光", "外光", "太陽", "昼光", "窓の光", "自然光")
                if any(marker in text for marker in daylight_markers):
                    return "daylight"
                off_markers = (
                    "消えてる",
                    "消えている",
                    "消えてます",
                    "消えています",
                    "消灯",
                    "オフ",
                    "ついてない",
                    "ついていない",
                    "点いてない",
                    "点いていない",
                    "付いてない",
                    "付いていない",
                )
                if any(marker in text for marker in off_markers):
                    return "off"
                on_markers = (
                    "ついてる",
                    "ついている",
                    "ついてます",
                    "点いてる",
                    "点いている",
                    "点いてます",
                    "付いてる",
                    "付いている",
                    "付いてます",
                    "オン",
                    "点灯",
                )
                if any(marker in text for marker in on_markers):
                    return "on"
                predicted_state = str((pending or {}).get("predicted_state") or "").strip().lower()
                yes_markers = ("はい", "うん", "そう", "その通り", "合ってる", "あってる", "正しい")
                if any(marker in text for marker in yes_markers):
                    if predicted_state in {"off", "unlit"}:
                        return "off"
                    return "on"
                no_markers = ("いいえ", "いや", "違う", "ちがう", "違います", "ううん")
                if any(marker in text for marker in no_markers):
                    if predicted_state in {"on", "lit"}:
                        return "off"
                    if predicted_state in {"off", "unlit"}:
                        return "on"
                    return "off"
                return ""


            def _pending_state_query(raw: str, pending_id: str = "") -> dict:
                pending = _loads_json(raw or "")
                if not isinstance(pending, dict):
                    return {}
                query_id = str(pending.get("state_query_id") or pending.get("target") or pending_id or "").strip()
                if query_id != "room_light":
                    return {}
                return pending


            def _parse_iso_datetime(value: str):
                try:
                    normalized = str(value or "").strip().replace("Z", "+00:00")
                    if not normalized:
                        return None
                    parsed = datetime.fromisoformat(normalized)
                    if parsed.tzinfo is None:
                        parsed = parsed.replace(tzinfo=timezone.utc)
                    return parsed.astimezone(timezone.utc)
                except Exception:
                    return None


            def _pending_age_seconds(pending: dict):
                if not isinstance(pending, dict):
                    return None
                for key in ("created_at", "updated_at", "observed_at"):
                    timestamp = _parse_iso_datetime(pending.get(key))
                    if timestamp is not None:
                        return max(0.0, (datetime.now(timezone.utc) - timestamp).total_seconds())
                return None


            def _pending_is_stale(pending: dict) -> bool:
                age = _pending_age_seconds(pending)
                return age is not None and age > STATE_QUERY_FEEDBACK_TTL_SECONDS


            def _build_pending_state_query(state_query_id: str, environment: dict, user_text: str) -> tuple[str, str]:
                if state_query_id != "room_light":
                    return "", ""
                room_light = _room_light_query(environment)
                if not room_light:
                    return "", ""
                if room_light.get("available") is False or _as_bool(room_light.get("stale")):
                    return "", ""
                evidence = room_light.get("evidence")
                observed_at = ""
                updated_at = ""
                if isinstance(evidence, dict):
                    observed_at = str(evidence.get("observed_at") or "")
                    updated_at = str(evidence.get("updated_at") or "")
                pending = {
                    "type": "state_query_pending",
                    "state_query_id": "room_light",
                    "target": "room_light",
                    "snapshot_id": str(environment.get("snapshot_id") or ""),
                    "authority": str(room_light.get("authority") or room_light.get("source") or ""),
                    "projected_by": str(room_light.get("projected_by") or ""),
                    "predicted_state": str(room_light.get("state") or "unknown"),
                    "confidence_label": str(room_light.get("confidence_label") or ""),
                    "answer_hint": str(room_light.get("answer_hint") or ""),
                    "user_query": (user_text or "").strip(),
                    "workflow_version": HCA_WORKFLOW_VERSION,
                    "created_at": datetime.now(timezone.utc).isoformat(),
                    "observed_at": str(room_light.get("observed_at") or observed_at),
                    "updated_at": str(room_light.get("updated_at") or updated_at),
                }
                if isinstance(evidence, dict):
                    pending["evidence"] = {
                        "source": evidence.get("source") or "",
                        "topic": evidence.get("topic") or "",
                        "observed_at": evidence.get("observed_at") or "",
                        "updated_at": evidence.get("updated_at") or "",
                        "lighting_type": evidence.get("lighting_type") or "",
                        "daylight_state": evidence.get("daylight_state") or "",
                        "electric_on_probability": evidence.get("electric_on_probability"),
                        "daylight_present_probability": evidence.get("daylight_present_probability"),
                        "dark_probability": evidence.get("dark_probability"),
                    }
                return "room_light", json.dumps(pending, ensure_ascii=False, sort_keys=True)


            def _idempotency_part(value) -> str:
                text = re.sub(r"[^A-Za-z0-9_.:-]+", "-", str(value or "").strip())
                text = text.strip("-._:")
                return (text[:80] or "none")


            def _feedback_idempotency_key(conversation_id: str, pending: dict, user_label: str) -> str:
                conversation_key = conversation_id or pending.get("conversation_id") or pending.get("user_query") or pending.get("created_at") or "no-conversation"
                snapshot_key = pending.get("snapshot_id") or "no-snapshot"
                return "state-query-feedback:{conversation}:{snapshot}:{label}".format(
                    conversation=_idempotency_part(conversation_key),
                    snapshot=_idempotency_part(snapshot_key),
                    label=_idempotency_part(user_label),
                )


            def _state_query_feedback(user_text: str, pending_raw: str, pending_id: str, environment: dict, conversation_id: str = "") -> dict:
                pending = _pending_state_query(pending_raw, pending_id)
                if not pending:
                    return {}
                if _pending_is_stale(pending):
                    return {}
                label = _room_light_feedback_label(user_text, pending)
                if not label:
                    return {}
                current_room_light = _room_light_query(environment)
                age = _pending_age_seconds(pending)
                feedback = {
                    "type": "state_query_feedback",
                    "target": "room_light",
                    "state_query_id": "room_light",
                    "authority": "user_feedback",
                    "source": "dify",
                    "workflow_version": HCA_WORKFLOW_VERSION,
                    "feedback_reason": str(pending.get("feedback_reason") or "user_correction_after_state_query"),
                    "idempotency_key": _feedback_idempotency_key(conversation_id, pending, label),
                    "source_context": str(pending.get("source_context") or "state_query"),
                    "action_id": str(pending.get("action_id") or ""),
                    "issue_id": str(pending.get("issue_id") or ""),
                    "expected_state": str(pending.get("expected_state") or ""),
                    "snapshot_id": str(pending.get("snapshot_id") or ""),
                    "current_snapshot_id": str(environment.get("snapshot_id") or ""),
                    "predicted_state": str(pending.get("predicted_state") or "unknown"),
                    "predicted_confidence_label": str(pending.get("confidence_label") or ""),
                    "user_label": label,
                    "user_text": (user_text or "").strip(),
                    "created_at": datetime.now(timezone.utc).isoformat(),
                    "pending": {
                        "authority": pending.get("authority") or "",
                        "projected_by": pending.get("projected_by") or "",
                        "answer_hint": pending.get("answer_hint") or "",
                        "user_query": pending.get("user_query") or "",
                        "created_at": pending.get("created_at") or "",
                        "observed_at": pending.get("observed_at") or "",
                        "updated_at": pending.get("updated_at") or "",
                        "evidence": pending.get("evidence") if isinstance(pending.get("evidence"), dict) else {},
                    },
                    "current_state_query": {
                        "state": current_room_light.get("state") if current_room_light else "",
                        "confidence_label": current_room_light.get("confidence_label") if current_room_light else "",
                        "answer_hint": current_room_light.get("answer_hint") if current_room_light else "",
                        "authority": current_room_light.get("authority") if current_room_light else "",
                    },
                }
                if age is not None:
                    feedback["pending_age_seconds"] = round(age, 3)
                return feedback


            def _state_query_feedback_expired(user_text: str, pending_raw: str, pending_id: str) -> bool:
                pending = _pending_state_query(pending_raw, pending_id)
                if not pending or not _pending_is_stale(pending):
                    return False
                return bool(_room_light_feedback_label(user_text, pending))


            def _feedback_reply(label: str) -> str:
                labels = {
                    "on": "ついてる",
                    "off": "消えてる",
                    "daylight": "日光の影響がある",
                    "unknown": "まだ分からない",
                }
                text = labels.get(label, "その状態")
                return f"[happy]なるほど、実際は{text}んだな。覚える材料として残しとくぜ。"


            def _feedback_expired_reply() -> str:
                return "[relaxed]ちょい時間が空いたな。今の状態をもう一回見てから覚えるほうがよさそうだ。"


            def _format_probability(value) -> str:
                try:
                    return f"{float(value):.2f}"
                except Exception:
                    return ""


            def _room_light_evidence_hint(room_light: dict) -> str:
                evidence = room_light.get("evidence") if isinstance(room_light, dict) else {}
                if not isinstance(evidence, dict):
                    evidence = {}
                lighting_type = str(evidence.get("lighting_type") or room_light.get("lighting_type") or "").strip().lower()
                daylight_state = str(evidence.get("daylight_state") or room_light.get("daylight_state") or "").strip().lower()
                probabilities = evidence.get("probabilities")
                if not isinstance(probabilities, dict):
                    probabilities = {}
                electric_on_probability = _format_probability(
                    evidence.get("electric_on_probability")
                    or evidence.get("electric_on")
                    or probabilities.get("electric_on")
                )
                daylight_probability = _format_probability(
                    evidence.get("daylight_present_probability")
                    or evidence.get("daylight_present")
                    or probabilities.get("daylight_present")
                )

                hints = {
                    "daylight": "日光の影響が強そうだ。",
                    "mixed": "外光と照明が混ざって見えてそうだ。",
                    "electric": "照明寄りの明るさに見えてそうだ。",
                    "dark": "かなり暗めに見えてるな。",
                }
                if lighting_type in hints:
                    return hints[lighting_type]
                if daylight_state in {"present", "strong"} or daylight_probability:
                    detail = f"日光っぽさは{daylight_probability}くらいだ。" if daylight_probability else "日光の影響がありそうだ。"
                    if electric_on_probability:
                        return f"照明ON推定は{electric_on_probability}、{detail}"
                    return detail
                if electric_on_probability:
                    return f"照明ON推定は{electric_on_probability}くらいだ。"
                return ""


            def _light_appliance_state(environment: dict) -> dict:
                appliances = environment.get("appliances") if isinstance(environment, dict) else {}
                if isinstance(appliances, dict):
                    light = appliances.get("light")
                    if isinstance(light, dict) and str(light.get("state") or "").strip().lower() in {"on", "off"}:
                        return light
                actions = environment.get("actions") if isinstance(environment, dict) else []
                if isinstance(actions, list):
                    for action in actions:
                        if not isinstance(action, dict):
                            continue
                        if str(action.get("appliance_id") or "").strip() != "light":
                            continue
                        current_state = action.get("current_state")
                        if isinstance(current_state, dict) and str(current_state.get("state") or "").strip().lower() in {"on", "off"}:
                            return current_state
                return {}


            def _light_appliance_state_reply(environment: dict, room_light=None) -> str:
                light = _light_appliance_state(environment)
                state = str(light.get("state") or "").strip().lower()
                if state not in {"on", "off"}:
                    return ""
                stale = _as_bool(light.get("stale"))
                state_text = "ついてる" if state == "on" else "消えてる"
                prefix = "最後に取れた機器状態では" if stale else "機器状態では"
                hint = _room_light_evidence_hint(room_light or {}) if isinstance(room_light, dict) else ""
                if not hint and isinstance(room_light, dict):
                    hint = str(room_light.get("answer_hint") or "").strip()
                if hint:
                    hint = re.sub(r"\s+", " ", hint).strip()
                    return f"[neutral]{prefix}、電気は{state_text}な。映像推定はまだ補助情報で、{hint} 違ってたら教えてくれ。"
                return f"[neutral]{prefix}、電気は{state_text}な。違ってたら教えてくれ。"


            def _state_query_reply(state_query_id: str, environment: dict) -> str:
                if state_query_id != "room_light":
                    return ""
                room_light = _room_light_query(environment)
                if not room_light:
                    appliance_reply = _light_appliance_state_reply(environment)
                    if appliance_reply:
                        return appliance_reply
                    return "[relaxed]今の環境情報だと、照明の状態はまだ確認できねえな。"

                available = room_light.get("available")
                stale = _as_bool(room_light.get("stale"))
                if available is False or stale:
                    appliance_reply = _light_appliance_state_reply(environment, room_light)
                    if appliance_reply:
                        return appliance_reply
                    return "[relaxed]今のセンサー情報だと、照明の状態はまだ確認できねえな。"

                authority = str(room_light.get("authority") or room_light.get("source") or "").strip()
                source_label = "映像推定" if authority in {"vision_snapshot_processor", "vision-snapshot-processor"} or "vision" in authority else "環境情報"
                state = str(room_light.get("state") or "unknown").strip().lower()
                answer_hint = str(room_light.get("answer_hint") or "").strip()
                confidence = str(room_light.get("confidence_label") or "").strip().lower()
                learning = room_light.get("learning") if isinstance(room_light.get("learning"), dict) else {}
                learning_level = _as_int(learning.get("level_index") if learning else 0, 0)

                def _confidence_tail() -> str:
                    if confidence == "high":
                        return "かなり自信ありだ。"
                    if confidence == "medium":
                        return "そこそこ見えてる。"
                    if confidence == "low":
                        return "まだ自信は低めだ。"
                    return ""

                if state in {"on", "lit"}:
                    tail = _confidence_tail()
                    return f"[neutral]{source_label}だと、照明はついてる可能性が高そうだな。{tail}合ってるか？"
                if state in {"off", "unlit"}:
                    tail = _confidence_tail()
                    return f"[neutral]{source_label}だと、照明は消えてる可能性が高そうだな。{tail}合ってるか？"

                hint = answer_hint or _room_light_evidence_hint(room_light)
                if hint:
                    hint = re.sub(r"\s+", " ", hint).strip()
                    appliance_reply = _light_appliance_state_reply(environment, room_light)
                    if appliance_reply:
                        return appliance_reply
                    if learning_level >= 3:
                        return f"[neutral]覚えた材料は増えてるが、今の{source_label}は断定しづらいな。{hint} 点いてる？消えてる？"
                    return f"[neutral]{source_label}だと断定しづらいな。{hint} 点いてる？消えてる？"
                appliance_reply = _light_appliance_state_reply(environment, room_light)
                if appliance_reply:
                    return appliance_reply
                return f"[neutral]{source_label}だとまだ断定しづらいな。点いてる？消えてる？"


            def _environment_debug(environment: dict, environment_status_code=0) -> dict:
                state_queries = environment.get("state_queries") if isinstance(environment, dict) else {}
                if not isinstance(state_queries, dict):
