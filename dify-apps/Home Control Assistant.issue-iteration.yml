            )
            TRUE_RE = re.compile(r"(confirmed\s*[:=]\s*true|\btrue\b|,true\b)")
            CONFIRM_RE = re.compile(r"(はい|ok|OK|お願い|実行|やって|頼む|いいよ|進めて)")
            UNRESOLVED = {"open", "retrying", "need_user", "failed"}
            ACTION_LABELS = {
                "light_on": "ライトをつける",
                "light_off": "ライトを消す",
                "fan_on": "扇風機をつける",
