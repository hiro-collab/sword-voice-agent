          \ -> dict:\n    if isinstance(raw, dict):\n        return raw\n    try:\n        parsed = json.loads(raw or \"{}\"\
          )\n    except Exception:\n        match = re.search(r\"\\{.*\\}\", raw or \"\", re.S)\n        if not match:\n \
          \           return {}\n        try:\n            parsed = json.loads(match.group(0))\n        except Exception:\n\
          \            return {}\n    return parsed if isinstance(parsed, dict) else {}\n\n\ndef _as_bool(value) -> bool:\n\
          \    if isinstance(value, bool):\n        return value\n    if isinstance(value, str):\n        return value.strip().lower()\
          \ in {\"true\", \"1\", \"yes\", \"y\"}\n    return False\n\n\ndef _as_int(value, default=1) -> int:\n    try:\n\
          \        return int(float(value))\n    except Exception:\n        return default\n\n\ndef main(text: str, result_json:\
          \ str) -> dict:\n    decision_data = _loads(text)\n    result = _loads(result_json)\n\n    issue_id = str(decision_data.get(\"\
          issue_id\") or result.get(\"issue_id\") or \"\")\n    attempt = _as_int(decision_data.get(\"attempt\") or result.get(\"\
          attempt\"), 1)\n    result_status = str(result.get(\"status\") or \"unknown\")\n    action_id = str(decision_data.get(\"\
          action_id\") or result.get(\"action_id\") or \"\")\n    decision = str(decision_data.get(\"decision\") or \"\").strip()\n\
          \    issue_status = str(decision_data.get(\"issue_status\") or \"\").strip()\n    next_input = str(decision_data.get(\"\
          next_input\") or \"\").strip()\n    user_reply = str(decision_data.get(\"user_reply\") or \"\").strip()\n    confirmed\
          \ = _as_bool(decision_data.get(\"confirmed\"))\n\n    if decision not in ALLOWED_DECISIONS:\n        if result_status\
          \ == \"success\":\n            decision = \"finish\"\n        elif result_status == \"confirmation_required\":\n\
          \            decision = \"ask_user\"\n        else:\n            decision = \"retry_ai\" if attempt < MAX_ATTEMPTS\
          \ else \"ask_user\"\n\n    if attempt >= MAX_ATTEMPTS and decision == \"retry_ai\":\n        decision = \"ask_user\"\
          \n        next_input = \"\"\n        user_reply = user_reply or \"[sad][motion:shrug]3回試したけど通らねえな。状況をもう少し教えてくれ。\"\
