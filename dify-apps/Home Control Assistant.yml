    - data:
        code: |
          import json

          def _loads(value):
              if isinstance(value, dict):
                  return value
              try:
                  parsed = json.loads(value or "{}")
              except Exception:
                  return {}
              if isinstance(parsed, str):
                  try:
                      parsed = json.loads(parsed)
                  except Exception:
                      return {}
              return parsed if isinstance(parsed, dict) else {}

          def main(body: str) -> dict:
              data = _loads(body)
              answer = data.get("speak") or data.get("message")
              if not answer:
                  answer = "操作結果を読み取れませんでした。"
              return {"answer": answer}
        code_language: python3
        outputs:
          answer:
            children: null
            type: string
