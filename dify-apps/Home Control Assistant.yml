    - data:
        code: |
          import json

          def _loads(value):
              if isinstance(value, dict):
                  return value
              try:
                  parsed = json.loads(value or "{}")
              except Exception:
                  return {}
              if isinstance(parsed, str):
                  try:
                      parsed = json.loads(parsed)
                  except Exception:
                      return {}
              return parsed if isinstance(parsed, dict) else {}

          def main(body: str) -> dict:
              data = _loads(body)
              message = data.get("speak") or data.get("message") or ""
              label = data.get("preview", {}).get("label") or data.get("action_id") or "その操作"
              action_id = data.get("action_id") or data.get("preview", {}).get("action_id") or ""

              if data.get("confirmation_required") and not data.get("executed"):
                  status = "confirmation_required"
              elif data.get("ok") is False:
                  status = "error"
              elif data.get("executed") is True:
                  status = "success"
              else:
                  status = "unknown"

              return {
                  "answer": json.dumps({
                      "status": status,
                      "ok": data.get("ok"),
                      "executed": data.get("executed"),
                      "confirmation_required": data.get("confirmation_required"),
                      "action_id": action_id,
                      "label": label,
                      "bridge_message": message,
                      "request_id": data.get("request_id"),
                  }, ensure_ascii=False),
              }
        code_language: python3
        outputs:
          answer:
            children: null
            type: string
