    - data:
        code: |
          import re

          ALLOWED_ACTIONS = {
              "light_on",
              "light_off",
              "fan_on",
              "fan_off",
              "aircon_on",
              "aircon_off",
              "door_open",
              "door_close",
              "door_stop",
              "vacuum_start",
              "vacuum_return",
              "vacuum_pause",
              "none",
          }

          ACTION_RE = re.compile(
              r"(light_on|light_off|fan_on|fan_off|aircon_on|aircon_off|door_open|door_close|door_stop|vacuum_start|vacuum_return|vacuum_pause|none)"
          )

          def main(text: str) -> dict:
              raw = (text or "").strip().lower()
              match = ACTION_RE.search(raw)
              action_id = match.group(1) if match else "none"
              if action_id not in ALLOWED_ACTIONS:
                  action_id = "none"
              return {
                  "action_id": action_id,
                  "is_action": action_id != "none",
              }
        code_language: python3
        outputs:
          action_id:
            children: null
            type: string
          is_action:
            children: null
            type: boolean
