          text: 'ユーザー発話を家電操作IDと確認状態に分類してください。

            出力はJSONだけ。説明文は禁止。


            形式:

            {"action_id":"light_on","confirmed":false}


            action_id は次のいずれか1つ。


            light_on

            light_off

            fan_on

            fan_off

            aircon_on

            aircon_off

            door_open

            door_close

            door_stop

            vacuum_start

            vacuum_return

            vacuum_pause

            none


            confirmed は true または false。

            confirmed=true にしてよいのは、直前の会話で同じ操作について確認が必要だと案内され、今回のユーザー発話がその確認への明確な実行承認だと意味的に判断できる場合だけ。

            承認判定では、文字面の完全一致に頼らず、音声認識の誤変換、近い発音、助詞の抜け、短い相槌、文脈を総合して意図を推定する。

            たとえば「はい、実行して」と同じ意味・近い発音・明確な承認意図に聞こえる発話は confirmed=true としてよい。

            ただし、確認待ちがない状態の短い相槌や、単なる雑談の肯定は action_id="none", confirmed=false。

            ユーザーが最初に「エアコンをつけて」「中扉を開けて」など操作依頼をした段階では confirmed=false。

            確認待ちがない状態の「はい」「OK」「お願い」は action_id="none", confirmed=false。

            「やっぱりやめて」「キャンセル」「しないで」は action_id="none", confirmed=false。


            例:

            ユーザー発話が「ライトをつけて」なら {"action_id":"light_on","confirmed":false}

            ユーザー発話が「エアコンをつけて」なら {"action_id":"aircon_on","confirmed":false}

            直前にエアコン操作の確認を求められ、ユーザー発話が「はい、実行して」なら {"action_id":"aircon_on","confirmed":true}

            直前に中扉操作の確認を求められ、ユーザー発話が「お願い」なら {"action_id":"door_open","confirmed":true}

            ユーザー発話が「天気を教えて」なら {"action_id":"none","confirmed":false}


            ユーザー発話:

            {{#sys.query#}}

            '
