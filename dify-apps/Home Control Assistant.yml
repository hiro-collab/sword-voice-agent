    - data:
        code: |
          import json
          import re

          ALLOWED_ACTIONS = {
              "light_on",
              "light_off",
              "fan_on",
              "fan_off",
              "aircon_on",
              "aircon_off",
              "door_open",
              "door_close",
              "door_stop",
              "vacuum_start",
              "vacuum_return",
              "vacuum_pause",
              "none",
          }

          ACTION_RE = re.compile(
              r"(light_on|light_off|fan_on|fan_off|aircon_on|aircon_off|door_open|door_close|door_stop|vacuum_start|vacuum_return|vacuum_pause|none)"
          )
          TRUE_RE = re.compile(r"(confirmed\s*[:=]\s*true|\btrue\b|,true\b)")

          def _loads_json(raw: str) -> dict:
              try:
                  parsed = json.loads(raw)
              except Exception:
                  match = re.search(r"\{.*\}", raw, re.S)
                  if not match:
                      return {}
                  try:
                      parsed = json.loads(match.group(0))
                  except Exception:
                      return {}
              return parsed if isinstance(parsed, dict) else {}

          def _as_bool(value) -> bool:
              if isinstance(value, bool):
                  return value
              if isinstance(value, str):
                  return value.strip().lower() in {"true", "1", "yes", "y"}
              return False

          def main(text: str) -> dict:
              raw = (text or "").strip().lower()
              data = _loads_json(raw)
              action_text = str(data.get("action_id") or data.get("action") or raw).lower()
              match = ACTION_RE.search(action_text)
              action_id = match.group(1) if match else "none"
              if action_id not in ALLOWED_ACTIONS:
                  action_id = "none"
              confirmed = _as_bool(data.get("confirmed"))
              if not confirmed and not data:
                  confirmed = bool(TRUE_RE.search(raw))
              if action_id == "none":
                  confirmed = False
              return {
                  "action_id": action_id,
                  "confirmed": confirmed,
                  "is_action": action_id != "none",
              }
